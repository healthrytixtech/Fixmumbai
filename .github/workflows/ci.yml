
name: Prisehat Pulse CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# cancels an outdated run when a newer commit arrives for the same ref.
concurrency:
  group: prisehat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_APP_URL: https://prisehat.healthrytix.com

    steps:
      - name: Check out repository  # downloads the repository source into the runner.
        uses: actions/checkout@v4

      - name: Set up Node.js    
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build  

  publish-image:
    name: Build and publish Docker image
    needs: test-and-build

    # Only publish after a successful push to main.
    # Pull requests must never publish deployment images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ghcr.io/healthrytixtech/fixmumbai:${{ github.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/healthrytixtech/Fixmumbai
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    needs: publish-image

    # Same gate as publish-image: only after a successful push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Deploys queue instead of overlapping or cancelling a half-finished one.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    env:
      STAGE_DIR: ${{ vars.STAGE_DIR }}
      STAGE_HEALTH_URL: ${{ vars.STAGE_HEALTH_URL }}
      SSH_TARGET: ${{ secrets.STAGE_SSH_USER }}@${{ secrets.STAGE_SSH_HOST }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Pinned host key, key-only auth, never prompt.
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          CFG

      - name: Copy compose file to VPS
        run: scp deploy/stage/compose.yml "$SSH_TARGET:$STAGE_DIR/compose.yml"

      - name: Deploy image on VPS
        run: |
          ssh "$SSH_TARGET" "STAGE_DIR='$STAGE_DIR' IMAGE_TAG='$IMAGE_TAG' bash -se" <<'REMOTE'
          cd "$STAGE_DIR"

          # Record what was running so a rollback target is in the log.
          prev=$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2- || true)
          echo "Previous IMAGE_TAG: ${prev:-<none>}"
          echo "New IMAGE_TAG:      $IMAGE_TAG"

          # Update the line, or add it if it is missing.
          if grep -qE '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
          else
            printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
          fi

          docker compose pull
          docker compose up -d
          REMOTE

      - name: Wait for health check
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$STAGE_HEALTH_URL" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Staging is healthy on $IMAGE_TAG"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed; recent container logs:"
          ssh "$SSH_TARGET" "cd '$STAGE_DIR' && docker compose logs --tail=100" || true
          exit 1
